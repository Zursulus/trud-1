{% load i18n %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Безопасность{% endblock %} · ТСН «ТРУД-1»</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f6f8; color: #1f2937; }
    .mfa-header { background: #0b57a4; color: #fff; padding: 18px 24px; }
    .mfa-header a { color: #fff; text-decoration: none; font-weight: 650; }
    .container { width: min(720px, calc(100% - 32px)); margin: 32px auto; }
    .row, .col-md-5 { width: 100%; }
    .offset-md-3 { margin: 0; }
    .mfa-card { background: #fff; border: 1px solid #d8dee8; border-radius: 10px; padding: 24px; box-shadow: 0 2px 10px rgba(15, 23, 42, .06); }
    h1 { margin-top: 0; font-size: 2rem; line-height: 1.2; }
    h2, h3 { margin-top: 1.5rem; }
    p, li { line-height: 1.55; }
    a { color: #0b57a4; }
    input, select, textarea { box-sizing: border-box; max-width: 100%; padding: 9px 10px; border: 1px solid #aab4c3; border-radius: 5px; font: inherit; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 6px; text-align: left; vertical-align: top; }
    .btn, button, input[type="submit"] { display: inline-block; border: 0; border-radius: 5px; padding: 10px 16px; background: #0b57a4; color: #fff; text-decoration: none; cursor: pointer; font: inherit; font-weight: 600; }
    .btn-secondary { background: #4b5563; }
    .btn-danger { background: #b42318; }
    .btn-warning { background: #9a6700; }
    .btn-info { background: #176b87; }
    .alert { padding: 12px 14px; border-radius: 6px; background: #fff4ce; }
    .errorlist { color: #b42318; }
    img { max-width: 100%; height: auto; }
    .mfa-footer { margin-top: 20px; font-size: .92rem; }
    @media (max-width: 640px) { .container { margin-top: 18px; } .mfa-card { padding: 18px; } h1 { font-size: 1.6rem; } }
  </style>
  {% block extra_media %}{% endblock %}
</head>
<body>
  <div class="mfa-header"><a href="{% url 'admin:index' %}">ТСН «ТРУД-1» · рабочая база</a></div>
  {% block content_wrapper %}
    <div class="container">
      <div class="mfa-card">
        {% block content %}{% endblock %}
        {% if user.is_authenticated %}<div class="mfa-footer"><a href="{% url 'admin:index' %}">← Вернуться в рабочую базу</a></div>{% endif %}
      </div>
    </div>
  {% endblock %}
</body>
</html>
