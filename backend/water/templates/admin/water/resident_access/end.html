{% extends "admin/base_site.html" %}
{% block content %}
<div id="content-main">
  <p><strong>{{ access }}</strong></p>
  <p>Запись не удаляется и не переписывается: будет зафиксирована только дата окончания доступа.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row"><input type="submit" value="Завершить доступ" class="default"></div>
  </form>
</div>
{% endblock %}
